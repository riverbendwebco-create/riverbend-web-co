.tr-sec{padding:44px 28px}
.tr-sec h3{font-family:var(--font-h);font-size:1.55rem;margin-bottom:6px}
.tr-sec .lead2{color:#64748B;margin-bottom:22px}
.area{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:14px;padding:18px 20px}
.area strong{display:flex;align-items:center;gap:8px;color:#1E3A8A;font-size:.98rem}
.area .towns{display:flex;flex-wrap:wrap;gap:8px}
.area .towns span{background:#fff;border:1px solid #BFDBFE;color:#1E40AF;font-weight:700;font-size:.82rem;padding:6px 12px;border-radius:999px}
.tr-svcs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tr-svc{border:1px solid var(--line);border-radius:12px;padding:18px;transition:box-shadow .2s,border-color .2s}
.tr-svc:hover{box-shadow:0 14px 30px -16px rgba(15,23,42,.3);border-color:#BFDBFE}
.tr-svc .ic{width:42px;height:42px;border-radius:10px;background:#EFF6FF;color:var(--tb);display:grid;place-items:center;margin-bottom:10px}
.tr-svc b{display:block;margin-bottom:4px}
.tr-svc ul{list-style:none;color:#475569;font-size:.86rem;display:flex;flex-direction:column;gap:3px}
.tr-svc li{position:relative;padding-left:18px}.tr-svc li::before{content:"";position:absolute;left:0;top:.35em;width:12px;height:12px;background:var(--tg);-webkit-mask:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Cpath d=%27M5 12.5l4.5 4.5L19 7.5%27 fill=%27none%27 stroke=%27black%27 stroke-width=%273%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E") center/contain no-repeat;mask:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Cpath d=%27M5 12.5l4.5 4.5L19 7.5%27 fill=%27none%27 stroke=%27black%27 stroke-width=%273%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E") center/contain no-repeat}
.projects{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.proj{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fff}
.proj .ph{height:200px;position:relative}
.proj .ph em{position:absolute;top:10px;left:10px;font-style:normal;background:rgba(15,23,42,.85);color:#fff;font-size:.7rem;font-weight:700;padding:4px 8px;border-radius:5px}
.proj .b{padding:14px 16px}
.proj b{display:block}
.proj small{color:#64748B;font-size:.84rem}
.tr-revs-wrap{background:#F8FAFC}
.rev-head{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.rev-score{font-family:var(--font-h);font-size:2.6rem;font-weight:800;line-height:1}
.rev-head .stars{color:#F59E0B;letter-spacing:2px;font-size:1.1rem}
.tr-revs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tr-rev{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column}
.tr-rev .stars{color:#F59E0B;letter-spacing:2px}
.tr-rev p{font-size:.92rem;color:#334155;margin:10px 0 14px;flex:1}
.who{display:flex;align-items:center;gap:10px}
.who .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.85rem}
.who b{display:block;font-size:.9rem}
.who small{color:#64748B;font-size:.78rem}
.tr-foot{background:#0F172A;color:#94A3B8;padding:30px 28px;display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:20px;font-size:.88rem}
.tr-foot h5{color:#fff;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}
@media (max-width:760px){
  .tr-hero,.tr-svcs,.tr-revs,.projects,.tr-foot{grid-template-columns:1fr}
  .tr-stats{grid-template-columns:1fr 1fr}.tr-stats div:nth-child(2){border-right:0}
  .tr-phone{display:none}.tr-logo{font-size:1rem}.tr-cta{white-space:nowrap}.tr-nav{padding:12px 16px}.tr-sec{padding:36px 20px}.tr-hero{padding:38px 20px}
}

.ico{width:1em;height:1em;display:inline-block;vertical-align:-.14em;flex:none}
.stars-svg{display:inline-flex;gap:2px;color:#F59E0B;vertical-align:-.1em}
.stars-svg svg{width:.95em;height:.95em}
.stars-svg.sm svg{width:10px;height:10px}
.socials .ico{width:17px;height:17px}
.tr-badges .ico,.tr-top .ico,.tr-phone .ico{width:15px;height:15px}
.pub-hh .ico{width:17px;height:17px;vertical-align:-.25em}

:root{--navy:#0F172A;--line:#E2E8F0;--slate:#64748B;--mist:#F1F5F9;--font-h:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",system-ui,sans-serif;--font-b:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-b);line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:64px;background:#0d0d0f}
body.t-trade{background:#fff}
a{color:inherit}
button,input,select,textarea{font:inherit}
img{max-width:100%}
.demo{display:block}
/* page-width layout for the modal designs */
.pub-wrap>*,.lg-sec>*,.tr-sec>*{max-width:1180px;margin-left:auto;margin-right:auto}
.pub-hero{min-height:min(78vh,640px)}
.lg-hero{min-height:min(78vh,620px)}
.lg-photos{grid-template-rows:clamp(150px,18vw,240px) clamp(150px,18vw,240px)}
/* no pills */
.live,.sauces span,.tapfilter button,.lg-nav .rsv,.lg-tabs button,.area .towns span{border-radius:6px!important}
.tr-svc,.proj,.spot-card,.panel,.menu-list,.menu-photo,.note-card,.chef,.area{border-radius:12px}
/* real links styled like the demo buttons */
a.pub-call,a.pub-dir{border:0;border-radius:10px;padding:13px 20px;font-weight:800;display:flex;align-items:center;gap:8px;font-size:.95rem;text-decoration:none;transition:transform .15s}
a.pub-call:hover,a.pub-dir:hover{transform:translateY(-1px)}
a.tr-phone{text-decoration:none;display:inline-flex;align-items:center;gap:6px}
/* keep nav, footer and hero content in a centered column on wide screens */
.pub-nav,.pub-foot,.lg-nav,.lg-foot,.tr-top,.tr-nav,.tr-foot,.pub-hero,.lg-hero,.tr-hero{padding-left:max(24px,calc((100vw - 1180px)/2))!important;padding-right:max(24px,calc((100vw - 1180px)/2))!important}
.pub-hero .in,.lg-hero .in{margin-left:0}
.tr-stats{padding-left:max(0px,calc((100vw - 1180px)/2));padding-right:max(0px,calc((100vw - 1180px)/2))}
.pub-logo-img{height:44px;width:auto;max-width:170px;object-fit:contain;display:block}
.lg-logo-img{height:46px;width:auto;max-width:180px;object-fit:contain}
.tr-logo-img{height:40px;width:auto;max-width:170px;object-fit:contain}
.lineup-grid.one{grid-template-columns:1fr}
.tr-svcs{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))!important}
.about-txt{color:#E7E5E4;line-height:1.7;white-space:pre-line;position:relative}
.muted{color:#A8A29E}
.socials a{display:inline-grid;place-items:center}
.mapbox .map-go{position:absolute;right:10px;bottom:10px;background:var(--gold);color:#1a1205;font-weight:800;font-size:.8rem;padding:7px 12px;border-radius:6px;text-decoration:none}
.note-d{color:#A8A29E;font-size:.9rem;margin-top:6px}
.lg-foot a{color:inherit;text-decoration:none}
.lg-ok,.tr-ok{display:none}
/* loading + Riverbend preview bar */
.state{min-height:100vh;display:grid;place-items:center;text-align:center;padding:30px;background:#0F172A;color:#E2E8F0}
.state h1{font-size:1.4rem;margin:12px 0 6px}.state p{color:#94A3B8}
.spin{width:28px;height:28px;border:3px solid rgba(255,255,255,.2);border-top-color:#60A5FA;border-radius:50%;animation:sp .8s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.rb-bar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#0F172A;color:#E2E8F0;border-top:1px solid rgba(96,165,250,.3);font-family:var(--font-b);padding-bottom:env(safe-area-inset-bottom)}
.rb-in{max-width:1180px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:14px;height:64px}
.rb-bar .t{font-size:.86rem;line-height:1.35;flex:1;min-width:0}.rb-bar .t b{color:#fff}.rb-bar .t span{color:#94A3B8}
.rb-bar .go{height:40px;padding:0 16px;border-radius:8px;background:#0052CC;color:#fff;font-weight:700;font-size:.88rem;text-decoration:none;display:inline-flex;align-items:center;white-space:nowrap}
@media (max-width:640px){.rb-bar .t span{display:none}.pub-nav,.pub-foot,.lg-nav,.lg-foot,.tr-top,.tr-nav,.tr-foot,.pub-hero,.lg-hero,.tr-hero{padding-left:18px!important;padding-right:18px!important}}
