<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://script.google.com https://script.googleusercontent.com; form-action 'none'; base-uri 'none'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'">
<title>Unsubscribe | Riverbend Web Co.</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#04070D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#04070D;--card:#0A101B;--card2:#0F1726;--line:#161F2E;--line2:#232E42;--ink:#E8EEF8;--txt:#CFD8E6;--mut:#8592A6;--dim:#5B6779;--blue:#2F7BFF;--red:#FF5A63;--green:#2BC48A;--amber:#F2B23B;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;--disp:'Barlow Condensed','Arial Narrow',Inter,sans-serif}
*{box-sizing:border-box}html,body{margin:0}body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}a{color:#5B9BFF}.hidden{display:none!important}
svg.rw{width:40px;height:auto;aspect-ratio:1115/562;display:block}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 60px;padding-top:max(18px,env(safe-area-inset-top))}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.bar b{color:#fff}.bar nav{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 13px;border-radius:7px;border:1px solid var(--line2);background:var(--card2);font-weight:600;font-size:.84rem;cursor:pointer;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{color:var(--red);border-color:rgba(255,90,99,.45)}.btn[disabled]{opacity:.5}
.k{display:block;font-family:var(--mono);font-size:.64rem;letter-spacing:.22em;color:var(--mut);text-transform:uppercase}
h1{font-family:var(--disp);font-style:italic;font-weight:700;font-size:2.4rem;line-height:1;margin:4px 0 14px;text-transform:uppercase;color:#fff}
h2{font-size:1rem;margin:0 0 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:12px 14px}.stat b{display:block;font-size:1.3rem;margin-top:4px}
.panel{background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:14px;margin-bottom:14px}
.cust{border-top:1px solid var(--line);padding:12px 2px}.cust:first-child{border-top:0}
.cust .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.cust b{color:#fff}
.cust .m{font-size:.82rem;color:var(--mut);margin-top:3px}
.tag{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 7px;border-radius:5px;border:1px solid var(--line2);color:var(--txt);margin-top:6px}
.tag.ok{color:var(--green);border-color:rgba(43,196,138,.4)}.tag.warn{color:var(--amber);border-color:rgba(242,178,59,.4)}
.field{height:40px;border:1px solid var(--line2);border-radius:8px;padding:0 10px;background:var(--bg);color:var(--ink);font-size:16px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.user{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding:10px 0}.user:first-of-type{border-top:0}
.msg{min-height:18px;margin-top:8px;font-size:.86rem;color:var(--mut)}.msg.err{color:var(--red)}.msg.ok{color:var(--green)}
@media(max-width:640px){.stats{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap" style="max-width:560px"><div class="bar"><b>Riverbend Web Co.</b></div>
<h1 style="font-size:1.8rem">Unsubscribe</h1><div class="panel"><p id="m">Stop getting emails from Riverbend Web Co.?</p><button class="btn primary" id="go" type="button">Yes, unsubscribe me</button></div>
<p class="msg">Riverbend Web Co. is a DBA of Outlaw Nightfall LLC, an Iowa limited liability company.</p></div>
<script src="/login/auth.js"></script>
<script>(()=>{ const t=location.hash.slice(1), m=document.getElementById('m'), b=document.getElementById('go');
 if(!/^[a-f0-9]{24}$/.test(t)){ b.remove(); m.textContent='This unsubscribe link is not complete. Email riverbendwebco@gmail.com and we will remove you.'; return; }
 /* A person has to tap the button: email link scanners open pages automatically and must not unsubscribe anyone. */
 b.addEventListener('click',async()=>{ b.disabled=true; b.textContent='One moment...';
  try{ const r=await fetch(window.RBAuth.API+'?action=unsub&t='+t).then(x=>x.json()); b.remove();
   m.textContent=r.ok?'You are unsubscribed. Riverbend Web Co. will not email you again.':'We could not find that link. Email riverbendwebco@gmail.com and we will remove you right away.';
  }catch(e){ b.disabled=false; b.textContent='Yes, unsubscribe me'; m.textContent='Could not reach our server. Try again, or email riverbendwebco@gmail.com and we will remove you right away.'; } }); })();</script></body></html>
