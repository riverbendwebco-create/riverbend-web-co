<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://script.google.com https://script.googleusercontent.com; form-action 'none'; base-uri 'none'; object-src 'none'; frame-src 'none'">
<title>riverbendwebcoleads | Riverbend Web Co.</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/leads/manifest.json">
<meta name="apple-mobile-web-app-title" content="RW Leads">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#04070D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#04070D;--card:#0A101B;--card2:#0F1726;--line:#161F2E;--line2:#232E42;--ink:#E8EEF8;--txt:#CFD8E6;--mut:#8592A6;--dim:#5B6779;--blue:#2F7BFF;--blue2:#5B9BFF;--red:#FF5A63;--orange:#FF8A3D;--amber:#F2B23B;--green:#2BC48A;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;--disp:'Barlow Condensed','Arial Narrow',Inter,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:420px;pointer-events:none;background:radial-gradient(900px 340px at 50% -120px,rgba(47,123,255,.13),transparent 70%);z-index:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue2)}
.hidden{display:none!important}
svg.rw{width:40px;height:auto;aspect-ratio:1115/562;display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:7px;border:1px solid var(--line2);background:var(--card2);font-weight:600;font-size:.82rem;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:#3A4864}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#246BF0}
.btn[disabled]{opacity:.55;cursor:default}
.btn.saved-on{color:var(--green);border-color:rgba(43,196,138,.45);background:rgba(43,196,138,.08)}
.gbtn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 15px;border-radius:8px;border:1px solid #9CC0FF;background:linear-gradient(#F3F7FF,#CFE0FF);color:#0A1A33;font-weight:700;font-size:.86rem;text-decoration:none;cursor:pointer;box-shadow:0 0 0 2px rgba(47,123,255,.35),0 0 20px rgba(47,123,255,.45)}
.msg{min-height:20px;margin-top:10px;font-size:.88rem;color:var(--mut)}
.msg.err{color:var(--red)}

/* Login */
.login{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:30px 26px}
.login-card small{display:block;margin-top:20px;font-family:var(--mono);font-size:.68rem;letter-spacing:.24em;color:var(--mut)}
.login-card h1{font-family:var(--disp);font-style:italic;font-weight:700;font-size:2.4rem;line-height:1;margin:2px 0 8px;text-transform:uppercase;color:#fff}
.login-card p{margin:0 0 18px;color:var(--mut);font-size:.9rem}
.field{display:block;width:100%;height:46px;border:1px solid var(--line2);border-radius:9px;padding:0 14px;outline:none;background:var(--bg);color:var(--ink)}
.field:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,123,255,.2)}

/* Shell */
.app{position:relative;z-index:1;min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.wrap{max-width:900px;margin:0 auto;padding:18px 20px 30px;padding-top:max(18px,env(safe-area-inset-top))}
.brandbar{display:flex;align-items:center;gap:10px;padding-bottom:14px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.brandbar b{font-size:.9rem;color:#fff}
.brandbar span{font-family:var(--mono);font-size:.64rem;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;margin-left:auto}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:14px}
.hd small{display:block;font-family:var(--mono);font-size:.68rem;letter-spacing:.24em;color:var(--mut);text-transform:uppercase}
.hd h1{font-family:var(--disp);font-style:italic;font-weight:700;font-size:2.5rem;line-height:.95;margin:3px 0 0;text-transform:uppercase;color:#fff;letter-spacing:.01em;text-shadow:0 0 22px rgba(91,155,255,.25)}
.search{display:flex;gap:8px;margin-bottom:12px}
.search label{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:46px;border:1px solid var(--line2);border-radius:10px;padding:0 14px;background:var(--card)}
.search label:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,123,255,.18)}
.search svg{flex:none;width:17px;height:17px;color:var(--dim)}
.search input{flex:1;min-width:0;border:0;outline:none;background:transparent;height:100%;font-size:.98rem;color:var(--ink)}
.search input::placeholder{color:var(--dim)}
.search button{flex:none;height:46px;padding:0 18px;border-radius:10px;border:0;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}

/* Stats and chips */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:4px 0 14px}
.stat{background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:12px 13px 10px;text-align:left;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.stat:hover{border-color:#3A4864}
.stat.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue),0 0 20px rgba(47,123,255,.22)}
.stat b{display:block;font-family:var(--disp);font-style:italic;font-weight:700;font-size:2.4rem;line-height:1;color:#fff}
.stat small{display:flex;align-items:center;gap:6px;margin-top:9px;font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.stat small i{width:6px;height:6px;border-radius:50%;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{height:32px;padding:0 13px;border-radius:8px;border:1px solid var(--line2);background:transparent;color:var(--txt);font-size:.87rem;cursor:pointer}
.chip:hover{border-color:#3A4864;color:#fff}
.chip.on{border-color:var(--blue);color:#fff;background:rgba(47,123,255,.12);box-shadow:inset 0 0 0 1px var(--blue)}
.say{margin:2px 0 14px;padding:10px 13px;font-size:.92rem;line-height:1.5;color:var(--txt);background:rgba(47,123,255,.06);border:1px solid rgba(47,123,255,.22);border-radius:9px}
.say em{display:block;font-style:normal;font-family:var(--mono);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
.sect{font-family:var(--mono);font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin:20px 0 10px}

/* Cards */
.cards{display:grid;gap:12px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:15px 16px 13px;transition:border-color .15s}
.card:hover{border-color:#334059}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.card h4{margin:0;font-size:1.02rem;font-weight:700;color:#fff;letter-spacing:-.01em}
.card .sub{color:var(--mut);font-size:.85rem;margin-top:3px}
.card .desc{margin:9px 0 0;font-size:.93rem;line-height:1.5;color:var(--txt)}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex:none}
.score{text-align:right;line-height:1}
.score b{font-family:var(--disp);font-style:italic;font-weight:700;font-size:2rem;color:#fff}
.score b.hot{color:var(--green)}.score b.mid{color:var(--amber)}.score b.low{color:var(--mut)}
.score small{display:block;font-family:var(--mono);font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:3px}
.bar{height:4px;border-radius:2px;background:var(--line2);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px}
.prog small{display:block;margin-top:6px;font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.pbar{height:4px;border-radius:2px;background:var(--line2);margin-top:9px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--blue);box-shadow:0 0 10px var(--blue);transition:width .4s}
.bar i.run{background:linear-gradient(90deg,var(--line2),var(--blue),var(--line2));background-size:200% 100%;animation:sh 1.2s infinite}
.badge{flex:none;font-family:var(--mono);font-size:.62rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:3px 7px;border-radius:4px;border:1px solid;white-space:nowrap}
.b-none{color:var(--red);border-color:rgba(255,90,99,.45);background:rgba(255,90,99,.08)}
.b-social{color:var(--orange);border-color:rgba(255,138,61,.45);background:rgba(255,138,61,.08)}
.b-weak{color:var(--amber);border-color:rgba(242,178,59,.45);background:rgba(242,178,59,.08)}
.b-site,.b-chain{color:var(--mut);border-color:var(--line2);background:transparent}
.b-stage{color:var(--blue2);border-color:rgba(91,155,255,.45);background:rgba(47,123,255,.1)}
.b-won{color:var(--green);border-color:rgba(43,196,138,.45);background:rgba(43,196,138,.08)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-family:var(--mono);font-size:.62rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;padding:4px 8px;border-radius:4px;border:1px solid var(--line2);color:var(--mut);text-decoration:none;background:transparent;cursor:pointer}
.tag.hi{color:#fff;border-color:#4A5670;font-weight:600}
a.tag:hover,button.tag:hover{color:#fff;border-color:var(--blue)}
.acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.when{font-size:.84rem;color:var(--mut)}
.done{margin-top:12px;padding:11px 12px;border:1px solid rgba(43,196,138,.35);background:rgba(43,196,138,.07);border-radius:9px;font-size:.88rem;color:var(--txt)}
.done.bad{border-color:rgba(255,90,99,.4);background:rgba(255,90,99,.07)}
.done .acts{margin-top:9px}
.pipe{display:grid;grid-template-columns:170px 1fr;gap:8px;margin-top:11px}
.pipe select,.pipe textarea{border:1px solid var(--line2);border-radius:8px;padding:7px 9px;background:var(--bg);color:var(--ink);font-size:.86rem;outline:none}
.pipe select:focus,.pipe textarea:focus{border-color:var(--blue)}
.pipe textarea{resize:vertical;min-height:36px}
.empty{padding:30px 18px;color:var(--mut);text-align:center;border:1px dashed var(--line2);border-radius:12px}
.note{font-size:.8rem;color:var(--dim);margin-top:14px}
.tips{background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:16px 18px}
.tips ul{margin:0;padding-left:18px;color:var(--txt);font-size:.9rem;line-height:1.8}
.skel{height:118px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(90deg,var(--card) 0,#121B2B 40%,var(--card) 80%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(4,7,13,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .t{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:70px;border:0;background:transparent;color:var(--dim);font-family:var(--mono);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;cursor:pointer}
.tabbar .t svg{width:20px;height:20px}
.tabbar .t:hover{color:var(--txt)}
.tabbar .t.on{color:#fff}
.tabbar .t.on::before{content:"";position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:84px;height:2px;background:var(--blue);box-shadow:0 0 12px var(--blue)}
.tabbar .n{position:absolute;top:7px;left:calc(50% + 6px);min-width:22px;height:17px;padding:0 6px;border-radius:5px;background:var(--blue);color:#fff;font-family:Inter,sans-serif;font-size:.66rem;font-weight:700;letter-spacing:0;display:grid;place-items:center}

@media (max-width:640px){
  .wrap{padding-left:14px;padding-right:14px}
  .hd h1{font-size:2.1rem}
  .stats{gap:7px}
  .stat{padding:10px 9px 8px}
  .stat b{font-size:1.9rem}
  .stat small{font-size:.54rem;letter-spacing:.08em}
  .stat small i{display:none}
  .search button{padding:0 14px}
  .pipe{grid-template-columns:1fr}
  .gbtn{height:32px;padding:0 12px;font-size:.8rem}
  .brandbar span{display:none}
}
</style>
</head>

<script>
(function(){
'use strict';
const API='https://script.google.com/macros/s/AKfycbwkosfcFSHGXy8EUaAFZ7Q-SFDFllV_k4n8qBABRxoj2hv59RspTU9APLQabwP_ohaW/exec';
const $=s=>document.querySelector(s);
function el(tag,props,...kids){
  const n=document.createElement(tag);
  if(props) for(const k in props){ const v=props[k]; if(v==null||v===false) continue;
    if(k==='class') n.className=v; else if(k==='text') n.textContent=v; else if(k.slice(0,2)==='on') n.addEventListener(k.slice(2),v); else n.setAttribute(k,v); }
  kids.flat(Infinity).forEach(c=>{ if(c==null||c===false) return; n.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return n;
}
let token=''; try{ token=sessionStorage.getItem('rbStudio')||''; }catch(_){}
let status={hasKey:false,stages:['New','Contacted','Demo built','Pitched','Won','Lost']};

async function api(body){
  let r;
  try{
    const res=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({token},body))});
    r=await res.json();
  }catch(_){ return {ok:false,error:'network'}; }
  if(r&&r.error==='auth') signOut(true);
  return r||{ok:false,error:'server'};
}

/* ---------- Login ---------- */
$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const pw=$('#pw').value; if(!pw) return;
  const b=$('#loginBtn'),m=$('#loginMsg'); b.disabled=true; b.textContent='Checking...'; m.textContent=''; m.className='msg';
  const r=await api({action:'login',password:pw});
  b.disabled=false; b.textContent='Log In';
  if(r.ok){ token=r.token; try{sessionStorage.setItem('rbStudio',token);}catch(_){} $('#pw').value=''; start(); return; }
  m.className='msg err';
  m.textContent={badpassword:'That password is not right.',locked:'Too many tries. Wait 15 minutes and try again.',network:'Cannot reach the server. Check your connection.'}[r.error]||'Something went wrong. Try again.';
});
function signOut(expired){
  if(!expired&&token) api({action:'logout'});
  token=''; try{sessionStorage.removeItem('rbStudio');}catch(_){}
  $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
  if(expired){ $('#loginMsg').className='msg err'; $('#loginMsg').textContent='Your session ended. Log in again.'; }
  $('#pw').focus();
}
$('#tabOut').addEventListener('click',()=>signOut(false));

const CATS=[
  [/\b(bars?|pubs?|taverns?|taps?|saloons?|taprooms?|lounges?|dive)\b/,'bars'],
  [/\bbrewer(y|ies)|winer(y|ies)|distiller(y|ies)\b/,'breweries and wineries'],
  [/\bpizza/,'pizza'],[/\bmexican|tacos?\b/,'mexican restaurants'],[/\bchinese|asian|thai|sushi|japanese\b/,'asian restaurants'],
  [/\b(bbq|barbecue|smokehouse)\b/,'bbq restaurants'],[/\b(coffee|cafes?|espresso)\b/,'coffee shops'],[/\bbaker(y|ies)|donuts?\b/,'bakeries'],
  [/\bfood trucks?\b/,'food trucks'],[/\b(restaurants?|diners?|eater(y|ies)|grills?|food)\b/,'restaurants'],
  [/\bcar ?wash/,'car washes'],[/\b(auto|car|truck)\s*(repair|mechanics?|shops?|service|garage)|\bmechanics?\b|\btires?\b|\boil change/,'auto repair'],[/\bbody shops?|collision\b/,'auto body shops'],
  [/\bplumb/,'plumbers'],[/\belectric/,'electricians'],[/\broof/,'roofing contractors'],[/\bhvac|heating|furnace|air condition/,'hvac'],
  [/\b(contractors?|construction|remodel|builders?)\b/,'contractors'],[/\b(landscap|lawn|snow removal|tree service)/,'landscaping'],
  [/\bclean(ing|ers)?\b|\bjanitor|maid/,'cleaning services'],[/\bpaint(ers|ing)\b/,'painters'],[/\bconcrete|paving|asphalt\b/,'concrete contractors'],
  [/\bhandym[ae]n\b/,'handyman'],[/\bpest|exterminat/,'pest control'],[/\btow(ing)?\b/,'towing'],[/\bmov(ers|ing company)\b/,'movers'],
  [/\b(salons?|hair)\b/,'hair salons'],[/\bbarbers?\b/,'barber shops'],[/\bnails?\b/,'nail salons'],[/\btattoo/,'tattoo shops'],[/\bspas?\b|massage/,'spas and massage'],
  [/\bgyms?|fitness|crossfit|yoga\b/,'gyms'],[/\bdentist|dental\b/,'dentists'],[/\bchiropract/,'chiropractors'],[/\bvet(erinar(y|ians))?s?\b|animal hospital/,'veterinarians'],
  [/\bboutiques?|cloth/,'clothing boutiques'],[/\bflorists?|flowers?\b/,'florists'],[/\bgift shops?|antiques?\b/,'gift and antique shops'],
  [/\breal estate|realtors?\b/,'real estate agents'],[/\binsurance\b/,'insurance agents'],[/\blawyers?|attorneys?|law firms?\b/,'lawyers'],
  [/\bdaycares?|child ?care\b/,'daycares'],[/\bchurch(es)?\b/,'churches'],[/\bphotograph/,'photographers'],[/\bdog groom|pet groom/,'pet groomers']
];
const TOWNS={'east dubuque':'East Dubuque, IL','galena':'Galena, IL','asbury':'Asbury, IA','peosta':'Peosta, IA','dyersville':'Dyersville, IA','epworth':'Epworth, IA','cascade':'Cascade, IA','platteville':'Platteville, WI','bellevue':'Bellevue, IA','farley':'Farley, IA','maquoketa':'Maquoketa, IA','dubuque':'Dubuque, IA'};
function understand(raw){
  const t=raw.toLowerCase().replace(/[^\w\s',&-]/g,' ').replace(/\s+/g,' ').trim();
  if(/^(hi|hey|hello|yo|sup)\b/.test(t)&&t.split(' ').length<4) return {type:'hello'};
  if(/\b(help|what can you|how do)\b/.test(t)) return {type:'help'};
  if(/\b(saved|my leads|pipeline|my list|follow ?ups?)\b/.test(t)) { const st=status.stages.find(s=>t.includes(s.toLowerCase())); return {type:'saved',stage:st||''}; }
  let mode='best';
  if(/\b(no|without|don'?t have|doesn'?t have|missing|needs?)\b.*\b(web ?sites?|sites?)\b|\bno site\b/.test(t)) mode='none';
  else if(/\b(bad|old|outdated|weak|ugly|broken|crappy|terrible|dated)\b/.test(t)) mode='weak';
  else if(/\ball\b/.test(t)) mode='all';
  let city='';
  for(const k in TOWNS) if(new RegExp('\\b(in|near|around)\\s+'+k+'\\b').test(t)) { city=TOWNS[k]; break; }
  let q='';
  for(const [re,label] of CATS) if(re.test(t)) { q=label; break; }
  if(!q){
    q=t.replace(/\b(find|show|get|give|me|some|any|the|a|an|leads?|businesses|business|places?|in|near|around|dubuque|iowa|ia|that|who|which|with|without|no|have|has|need|needs|don'?t|doesn'?t|web ?sites?|sites?|bad|old|outdated|weak|all|please|for|of|look|looking|search)\b/g,' ').replace(/\s+/g,' ').trim();
    for(const k in TOWNS) q=q.replace(new RegExp('\\b'+k.replace(' ','\\s')+'\\b','g'),'').trim();
  }
  if(!q) return {type:'unclear'};
  return {type:'find',q,mode,city};
}

/* ---------- Layout ---------- */
const inner=$('#inner');
const QUICK=[['Bars','Bars'],['Restaurants','Restaurants'],['Pizza','Pizza'],['Coffee','Coffee shops'],['Auto repair','Auto repair shops'],['Contractors','Contractors'],['Roofers','Roofers'],['Salons','Hair salons'],['Boutiques','Boutiques']];
const TAGS={none:'No website',social:'Social only',weak:'Weak site',site:'Has site',chain:'Chain'};
let savedAll=[], reqId=0;
function setNav(which){ $('#tabFind').classList.toggle('on',which==='find'); $('#tabSaved').classList.toggle('on',which==='saved'); }
function head(label,title,btn){ $('#hd').replaceChildren(el('div',null,el('small',null,label),el('h1',null,title)),btn||''); }
function paint(...kids){ inner.replaceChildren(...kids.flat()); window.scrollTo(0,0); }
function say(text,q){ return el('div',{class:'say'},q?el('em',null,'You asked: '+q):null,text); }
function tel(p){ const d=String(p||'').replace(/\D/g,''); return d.length>=10?'tel:+1'+d.slice(-10):''; }
function cap(t){ return t.charAt(0).toUpperCase()+t.slice(1); }
function town(s){ const m=String(s||'').match(/([A-Za-z .]+),\s*(IA|IL|WI)\b/); return m?m[1].trim()+', '+m[2]:''; }
function chipRow(items,cur,fn){ const bs=items.map(([k,label])=>{ const b=el('button',{type:'button',class:'chip'+(k===cur?' on':'')},label); b.addEventListener('click',()=>{ bs.forEach(x=>x.classList.remove('on')); b.classList.add('on'); fn(k); }); return b; }); return el('div',{class:'chips'},bs); }
function statBox(n,label,color){ return el('button',{type:'button',class:'stat'},el('b',null,String(n)),el('small',null,color?el('i',{style:'background:'+color}):null,label)); }
function studioBtn(){ return el('a',{class:'gbtn',href:'/studio/'},'+ New demo'); }

function home(){
  setNav('find');
  head('Pipeline','Leads',studioBtn());
  const by=stageCounts();
  const four=[['New','New'],['Contacted','Contacted'],['Pitched','Pitched'],['Won','Won']].map(([k,label])=>{ const b=statBox(by[k]||0,label); b.addEventListener('click',()=>showSaved(k)); return b; });
  const recent=savedAll.filter(l=>l.stage!=='Won'&&l.stage!=='Lost').slice(0,4);
  paint(chipRow(QUICK.map(([t,q])=>[q,t]),'',q=>send(q)),
    el('div',{class:'stats'},four),
    el('div',{class:'sect'},recent.length?'Working on':'Things you can ask'),
    recent.length?el('div',{class:'cards'},recent.map(savedCard)):
    el('div',{class:'tips'},el('ul',null,
      el('li',null,'"bars with no website" or "restaurants with bad websites"'),
      el('li',null,'"roofers in Asbury", "salons in Galena", "pizza in East Dubuque"'),
      el('li',null,'"saved leads" or "saved leads pitched"'))));
}

async function send(text){
  text=String(text||'').trim(); if(!text) return;
  $('#q').value=''; $('#q').blur();
  const it=understand(text);
  if(it.type==='hello'||it.type==='help') return home();
  if(it.type==='unclear'){ head('Search','Leads'); return paint(say('Tell me a kind of business, like bars, pizza, roofers or hair salons.',text)); }
  if(it.type==='saved') return showSaved(it.stage);
  setNav('find');
  const where=it.city&&!/^Dubuque/.test(it.city)?it.city.split(',')[0]:'Dubuque';
  head('Search · '+where,cap(it.q));
  const my=++reqId;
  paint(say('Looking for '+it.q+' around '+where+'...',text),
    el('div',{class:'cards'},[0,1,2,3].map(()=>el('div',{class:'skel'}))));
  const r=await api({action:'leads_find',q:it.q,city:it.city||undefined,fast:true});
  if(my!==reqId) return;
  if(!r.ok) return paint(say(r.message||'That search did not work. Try again in a minute.',text));
  showResults(r,it,text,where);
}

function showResults(r,it,text,where){
  if(!r.counts.total) return paint(say('I could not find any '+it.q+' around '+where+'. Try another word.',text));
  const leads=r.leads, cardOf={}, my=reqId;
  const isHot=l=>l.kind==='none'||l.kind==='social'||l.kind==='weak';
  function grp(){ const g={best:leads.filter(isHot),none:leads.filter(l=>l.kind==='none'||l.kind==='social'),weak:leads.filter(l=>l.kind==='weak'),all:leads};
    for(const k in g) g[k]=g[k].slice().sort((a,b)=>chance(b)-chance(a)); return g; }
  let groups=grp();
  let cur=it.mode==='none'?'none':it.mode==='weak'?'weak':it.mode==='all'?'all':'best';
  if(!groups[cur].length) cur='all';
  const list=el('div',{class:'cards'});
  const boxes=[['best','Best leads','#2F7BFF'],['none','No website','#FF5A63'],['weak','Weak site','#F2B23B'],['all','All found','#5B6779']].map(([k,label,color])=>{
    const b=statBox(groups[k].length,label,color); b.dataset.k=k; b.addEventListener('click',()=>show(k)); return b; });
  function show(k){ cur=k; boxes.forEach(b=>b.classList.toggle('on',b.dataset.k===k));
    list.replaceChildren(...(groups[k].length?groups[k].map(l=>(cardOf[l.id]=leadCard(l))):[el('div',{class:'empty'},'Nothing in this group.')])); }
  show(cur);
  const msg=el('span'), prog=el('div',{class:'prog'});
  const sayEl=el('div',{class:'say'},el('em',null,'You asked: '+text),msg,prog);
  const biz=n=>n+(n===1?' business':' businesses'), has=n=>n===1?' has':' have';
  function update(){
    groups=grp();
    boxes.forEach(b=>{ b.querySelector('b').textContent=String(groups[b.dataset.k].length); });
    const left=leads.filter(l=>l.pending).length, total=leads.length;
    const nn=leads.filter(l=>(l.kind==='none'||l.kind==='social')&&!l.pending).length, nw=leads.filter(l=>l.kind==='weak'&&!l.pending).length;
    if(left){ msg.textContent='Found '+biz(total)+' around '+where+'. Checking their websites now, the cards update as each one finishes.';
      prog.replaceChildren(el('div',{class:'pbar'},el('i',{style:'width:'+Math.round((total-left)/total*100)+'%'})),el('small',null,'Checked '+(total-left)+' of '+total)); }
    else { msg.textContent='Found '+biz(total)+' around '+where+'. '+(nn?nn+has(nn)+' no real website and '+nw+has(nw)+' a weak one. Sorted by chance of landing them.':'Most already have a website. '+nw+(nw===1?' looks':' look')+' weak.'); prog.replaceChildren(); }
  }
  update();
  paint(sayEl,el('div',{class:'stats'},boxes),list,
    el('p',{class:'note'},'Chance is an estimate from the website check, phone and type of business, not a promise. '+(r.free?'From free public map data, so a few businesses may be missing. ':'')+'Open their site yourself before you pitch.'));
  const pend=leads.filter(l=>l.pending);
  if(!pend.length) return;
  const batches=[]; for(let i=0;i<pend.length;i+=5) batches.push(pend.slice(i,i+5));
  let bi=0;
  function redraw(l){ const cd=cardOf[l.id]; if(cd&&cd.isConnected){ const n=leadCard(l); cardOf[l.id]=n; cd.replaceWith(n); } }
  async function worker(){
    while(bi<batches.length){
      const b=batches[bi++];
      const res=await api({action:'leads_verify',leads:b});
      if(my!==reqId) return;
      if(res.ok) res.leads.forEach(u=>{ const l=leads.find(x=>x.id===u.id); if(!l) return; const sv=l.saved; Object.assign(l,u,{pending:false,searchPending:false,saved:sv}); redraw(l); });
      b.forEach(l=>{ if(l.pending){ l.pending=false; if(l.searchPending){ l.searchPending=false; l.issues=['No website listed on the map (could not finish the check, double check)']; } redraw(l); } });
      update();
    }
  }
  Promise.all([worker(),worker(),worker()]).then(()=>{ if(my===reqId&&window.scrollY<150) show(cur); });
}

function chance(l){
  let s={none:72,social:66,weak:38,site:10,chain:2}[l.kind]||20;
  if(l.kind==='weak') s+=Math.min(4,(l.issues||[]).length)*7;
  s+=tel(l.phone)?8:-12;
  if(/bar|pub|tavern|restaurant|pizza|grill|cafe|coffee|bakery|salon|barber|nail|spa|repair|auto|contractor|roof|plumb|electric|hvac|landscap|clean|paint|concrete|handyman|tow|groom|tattoo|gym/i.test((l.type||'')+' '+(l.ptype||''))) s+=6;
  if(l.reviews>=50) s+=4;
  if(l.maps) s+=2;
  return Math.max(1,Math.min(97,Math.round(s)));
}
function leadCard(l){
  const where=town(l.city)||town(l.address)||'Dubuque, IA';
  const saveBtn=el('button',{type:'button',class:'btn'+(l.saved?' saved-on':''),text:l.saved?'Saved':'Save'});
  saveBtn.addEventListener('click',async()=>{
    if(l.saved) return;
    saveBtn.disabled=true; saveBtn.textContent='Saving...';
    const r=await api({action:'leads_save',lead:l});
    saveBtn.disabled=false;
    if(r.ok){ l.saved='New'; saveBtn.textContent='Saved'; saveBtn.classList.add('saved-on'); if(!r.already) refreshSaved(); } else saveBtn.textContent='Save';
  });
  const demoBtn=el('button',{type:'button',class:'btn primary',text:'Build demo'});
  const card=el('div',{class:'card'});
  demoBtn.addEventListener('click',()=>buildDemo(l,demoBtn,card));
  const pc=l.pending?0:chance(l);
  const issues=(l.issues||[]).filter(Boolean);
  const desc=l.kind==='site'?'Has a working website'+(l.website?' ('+String(l.website).replace(/^https?:\/\/(www\.)?/,'').replace(/\/.*$/,'')+')':'')+'.':l.kind==='chain'?'Part of a chain, so the website is run by head office.':(issues.length?issues.join('. ')+'.':TAGS[l.kind]+'.');
  card.append(
    el('div',{class:'top'},el('div',null,el('h4',null,l.name),el('div',{class:'sub'},[l.type,where].filter(Boolean).join(' · '))),el('div',{class:'rt'},el('span',{class:'badge b-'+(l.pending?'site':l.kind)},l.pending?'Checking':(TAGS[l.kind]||'Lead')),el('div',{class:'score',title:'Estimated chance of landing this lead'},el('b',{class:l.pending?'low':pc>=60?'hot':pc>=35?'mid':'low'},l.pending?'--':pc+'%'),el('small',null,'Chance')))),
    el('div',{class:'bar'},el('i',{class:l.pending?'run':'',style:'width:'+(l.pending?100:pc)+'%;background:'+(pc>=60?'var(--green)':pc>=35?'var(--amber)':'var(--dim)')})),
    el('p',{class:'desc'},l.pending?(l.searchPending?'Checking for a website...':'Checking their website...'):desc.replace(/\.\.$/,'.')),
    el('div',{class:'foot'},
      el('div',{class:'tags'},el('span',{class:'tag hi'},where.split(',')[0]),
        tel(l.phone)?el('a',{class:'tag',href:tel(l.phone),title:l.phone},'Phone'):null,
        l.maps?el('a',{class:'tag',href:l.maps,target:'_blank',rel:'noopener'},'Map'):null,
        l.website?el('a',{class:'tag',href:l.website,target:'_blank',rel:'noopener'},'Site'):null),
      el('div',{class:'acts'},saveBtn,demoBtn)));
  return card;
}

async function buildDemo(l,btn,card){
  btn.disabled=true; btn.textContent='Building...';
  const old=card.querySelector('.done'); if(old) old.remove();
  const r=await api({action:'leads_demo',lead:l});
  btn.disabled=false; btn.textContent='Build demo';
  if(!r.ok){ card.appendChild(el('div',{class:'done bad'},'Could not build the demo. Try again.')); return; }
  if(!l.saved){ l.saved='Demo built'; refreshSaved(); }
  const got=[r.items?r.items+' menu items':'',r.photos?r.photos+' photos':''].filter(Boolean).join(' and ');
  card.appendChild(el('div',{class:'done'},el('b',null,'Demo ready. '),got?'Pulled '+got+' from their site.':'Add photos in the Studio before you pitch.',
    el('div',{class:'acts'},
      el('a',{class:'btn primary',href:'/demo/?d='+encodeURIComponent(r.slug),target:'_blank',rel:'noopener'},'Open demo'),
      el('a',{class:'btn',href:'/studio/#'+encodeURIComponent(r.slug),target:'_blank',rel:'noopener'},'Edit in Studio'))));
}

/* ---------- Saved ---------- */
function stageCounts(){ const by={}; savedAll.forEach(l=>{ by[l.stage]=(by[l.stage]||0)+1; }); return by; }
function setCount(n){ $('#savedCount').textContent=String(n); }
async function refreshSaved(){ const r=await api({action:'leads_saved'}); if(r.ok){ savedAll=r.leads||[]; setCount(savedAll.length); } return r; }
async function showSaved(stage){
  setNav('saved');
  head('Pipeline','Saved',studioBtn());
  const my=++reqId;
  paint(el('div',{class:'cards'},[0,1,2].map(()=>el('div',{class:'skel'}))));
  const r=await refreshSaved();
  if(my!==reqId) return;
  if(!r.ok) return paint(say('Could not load your saved leads. Try again.'));
  let cur=stage||'Active';
  const by=stageCounts();
  const list=el('div',{class:'cards'});
  const pick=a=>cur==='All'?a:cur==='Active'?a.filter(l=>l.stage!=='Won'&&l.stage!=='Lost'):a.filter(l=>l.stage===cur);
  function show(k){ cur=k; const arr=pick(savedAll);
    list.replaceChildren(...(arr.length?arr.map(savedCard):[el('div',{class:'empty'},savedAll.length?'No leads in '+k+'.':'No saved leads yet. Search above and tap Save.')])); }
  const four=['New','Contacted','Pitched','Won'].map(k=>{ const b=statBox(by[k]||0,k); b.addEventListener('click',()=>{ chips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.textContent===k)); show(k); }); return b; });
  const chips=chipRow([['Active','Active']].concat(status.stages.map(s=>[s,s]),[['All','All']]),cur,show);
  show(cur);
  paint(el('div',{class:'stats'},four),chips,list);
}
function savedCard(l){
  const kind=/no website/i.test(l.lead)?'none':/page, no real|social|facebook/i.test(l.lead)?'social':l.lead?'weak':'site';
  const stageEl=el('span',{class:'badge '+(l.stage==='Won'?'b-won':'b-stage')},l.stage);
  const sel=el('select',{'aria-label':'Stage'},status.stages.map(s=>{ const o=el('option',{value:s},s); if(s===l.stage) o.selected=true; return o; }));
  sel.addEventListener('change',async()=>{ const r=await api({action:'leads_update',id:l.id,stage:sel.value}); if(r.ok){ l.stage=sel.value; stageEl.textContent=sel.value; stageEl.className='badge '+(l.stage==='Won'?'b-won':'b-stage'); } });
  const notes=el('textarea',{rows:'1',placeholder:'Notes','aria-label':'Notes'});
  notes.value=l.notes||'';
  notes.addEventListener('blur',async()=>{ if(notes.value!==l.notes){ const r=await api({action:'leads_update',id:l.id,notes:notes.value}); if(r.ok) l.notes=notes.value; } });
  const where=town(l.address);
  const rm=el('button',{type:'button',class:'tag'},'Remove');
  const card=el('div',{class:'card'},
    el('div',{class:'top'},el('div',null,el('h4',null,l.name),el('div',{class:'sub'},[l.type,where||l.address].filter(Boolean).join(' · '))),stageEl),
    l.lead?el('p',{class:'desc'},l.lead.split('; ').join('. ').replace(/\.?$/,'.')):null,
    el('div',{class:'pipe'},sel,notes),
    el('div',{class:'foot'},
      el('div',{class:'tags'},el('span',{class:'tag hi'},TAGS[kind]),
        tel(l.phone)?el('a',{class:'tag',href:tel(l.phone),title:l.phone},'Phone'):null,
        l.maps?el('a',{class:'tag',href:l.maps,target:'_blank',rel:'noopener'},'Map'):null,
        l.website?el('a',{class:'tag',href:l.website,target:'_blank',rel:'noopener'},'Site'):null,
        l.demo?el('a',{class:'tag',href:'/demo/?d='+encodeURIComponent(l.demo),target:'_blank',rel:'noopener'},'Demo'):null,rm),
      l.saved?el('span',{class:'when'},'Saved '+l.saved):null));
  rm.addEventListener('click',async()=>{ if(!confirm('Remove '+l.name+'?')) return; const r=await api({action:'leads_update',id:l.id,remove:true}); if(r.ok){ card.remove(); savedAll=savedAll.filter(x=>x.id!==l.id); setCount(savedAll.length); } });
  return card;
}

/* ---------- Wiring ---------- */
$('#chatForm').addEventListener('submit',e=>{ e.preventDefault(); send($('#q').value); });
$('#tabFind').addEventListener('click',home);
$('#tabSaved').addEventListener('click',()=>showSaved(''));

async function start(){
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  home();
  const s=await api({action:'leads_status'});
  if(s.ok) status=Object.assign(status,s);
  const sv=await refreshSaved();
  if(sv.ok&&$('#tabFind').classList.contains('on')&&!inner.querySelector('.skel,.say')) home();
}
if(token) start(); else $('#pw').focus();
})();
</script>
