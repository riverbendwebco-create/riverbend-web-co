<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://script.google.com https://script.googleusercontent.com; form-action 'none'; base-uri 'none'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'">
<title>riverbendwebcoleads | Riverbend Web Co.</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/leads/manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0F172A;--slate:#1E293B;--ink:#0F172A;--mut:#64748B;--line:#E2E8F0;--soft:#F8FAFC;--blue:#0052CC;--blue2:#60A5FA;--red:#DC2626;--amber:#B45309;--green:#16A34A}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:var(--ink);background:#F1F5F9;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.hidden{display:none!important}
svg.rw{width:52px;height:auto;aspect-ratio:1115/562;display:block}

/* Login */
.login{min-height:100%;display:grid;place-items:center;padding:24px}
.login-card{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:30px 26px;box-shadow:0 10px 30px rgba(15,23,42,.06)}
.login-card h1{font-size:1.25rem;margin:18px 0 4px;letter-spacing:-.01em}
.login-card p{margin:0 0 18px;color:var(--mut);font-size:.92rem}
.field{display:block;width:100%;height:46px;border:1px solid #CBD5E1;border-radius:8px;padding:0 14px;background:#fff;outline:none}
.field:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,82,204,.15)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 16px;border-radius:8px;border:1px solid transparent;font-weight:700;font-size:.9rem;cursor:pointer;text-decoration:none;white-space:nowrap;background:#fff;color:var(--ink);border-color:#CBD5E1}
.btn:hover{border-color:#94A3B8}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#0047B3}
.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.sm{height:34px;padding:0 11px;font-size:.82rem}
.btn[disabled]{opacity:.55;cursor:default}
.msg{min-height:20px;margin-top:10px;font-size:.88rem;color:var(--mut)}
.msg.err{color:var(--red)}

/* App shell */
.app{height:100%;display:flex;flex-direction:column}
.top{flex:none;background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 18px;padding-top:max(12px,env(safe-area-inset-top))}
.top .t b{display:block;font-size:1rem;letter-spacing:-.01em}
.top .t span{display:block;font-size:.75rem;color:#94A3B8}
.top .sp{flex:1}
.top button{white-space:nowrap;background:transparent;border:1px solid #334155;color:#E2E8F0;border-radius:8px;height:34px;padding:0 12px;font-weight:600;font-size:.82rem;cursor:pointer}
.top button:hover{border-color:#64748B}
.feed{flex:1;overflow-y:auto;padding:22px 16px 10px;-webkit-overflow-scrolling:touch}
.wrap{max-width:820px;margin:0 auto}
.row{display:flex;margin:0 0 14px}
.row.me{justify-content:flex-end}
.bubble{max-width:88%;padding:12px 15px;border-radius:12px;line-height:1.5;font-size:.95rem}
.me .bubble{background:var(--navy);color:#fff;border-bottom-right-radius:4px}
.bot .bubble{background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.bot .bubble p{margin:0 0 8px}.bot .bubble p:last-child{margin:0}
.bot.wide .bubble{max-width:100%;width:100%}
.sugs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.sug{border:1px solid #CBD5E1;background:#fff;border-radius:8px;padding:7px 11px;font-size:.84rem;font-weight:600;cursor:pointer;color:var(--slate)}
.sug:hover{border-color:var(--blue);color:var(--blue)}
.typing{display:inline-flex;gap:5px;align-items:center;color:var(--mut);font-size:.88rem}
.dot{width:6px;height:6px;border-radius:50%;background:#94A3B8;animation:b 1s infinite}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3}40%{opacity:1}}

/* Stats line */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 4px}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--soft)}
.stat b{display:block;font-size:1.25rem;line-height:1.1}
.stat span{font-size:.74rem;color:var(--mut);font-weight:600}
.stat.hot b{color:var(--red)}.stat.warm b{color:var(--amber)}

/* Lead cards */
.cards{display:grid;gap:10px;margin-top:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 15px}
.card-h{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.card h3{margin:0;font-size:1rem;letter-spacing:-.01em}
.card .sub{color:var(--mut);font-size:.82rem;margin-top:2px}
.tag{flex:none;font-size:.72rem;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:4px 8px;border-radius:6px;border:1px solid}
.tag.none{color:var(--red);border-color:#FECACA;background:#FEF2F2}
.tag.social{color:#9A3412;border-color:#FED7AA;background:#FFF7ED}
.tag.weak{color:var(--amber);border-color:#FDE68A;background:#FFFBEB}
.tag.site{color:#334155;border-color:var(--line);background:var(--soft)}
.tag.chain{color:#475569;border-color:var(--line);background:var(--soft)}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin:9px 0 0;font-size:.85rem;color:#334155}
.issues{margin:8px 0 0;padding-left:18px;font-size:.85rem;color:#334155}
.issues li{margin:2px 0}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.saved-on{color:var(--green);border-color:#BBF7D0;background:#F0FDF4}
.pipe{display:grid;grid-template-columns:160px 1fr;gap:8px;margin-top:10px}
.pipe select,.pipe textarea{border:1px solid #CBD5E1;border-radius:8px;padding:7px 9px;background:#fff;font-size:.85rem}
.pipe textarea{resize:vertical;min-height:58px}
.more{margin-top:10px}

/* Composer */
.composer{flex:none;background:#fff;border-top:1px solid var(--line);padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.composer form{display:flex;gap:8px;max-width:820px;margin:0 auto}
.composer input{flex:1;height:46px;border:1px solid #CBD5E1;border-radius:10px;padding:0 14px;outline:none;font-size:1rem}
.composer input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,82,204,.15)}
.composer button{height:46px;padding:0 18px;border-radius:10px;border:0;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}

/* Key setup */
.steps{margin:6px 0 10px;padding-left:20px;font-size:.9rem}
.steps li{margin:5px 0}
.keyrow{display:flex;gap:8px;margin-top:6px}
.keyrow input{flex:1;height:42px;border:1px solid #CBD5E1;border-radius:8px;padding:0 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem}
.note{font-size:.8rem;color:var(--mut)}
@media (max-width:600px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .pipe{grid-template-columns:1fr}
  .bubble{max-width:94%}
  .top{padding:10px 12px}
  .top .t span{display:none}
  .top .t b{font-size:.9rem}
  .top{gap:8px}
  .top button{height:32px;padding:0 9px;font-size:.78rem}
  .top svg.rw{width:40px}
}
</style>
</head>

<section class="login" id="login">
  <form class="login-card" id="loginForm" autocomplete="on">
    <svg class="rw" aria-label="Riverbend Web Co."><use href="#rw-light"/></svg>
    <h1>riverbendwebcoleads</h1>
    <p>Find Dubuque businesses that need a website. Same password as the Demo Studio.</p>
    <input class="field" id="pw" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password">
    <button class="btn primary" id="loginBtn" type="submit" style="width:100%;margin-top:12px;height:46px">Log In</button>
    <div class="msg" id="loginMsg" role="alert"></div>
  </form>
</section>

<section class="app hidden" id="app">
  <header class="top">
    <svg class="rw" aria-hidden="true"><use href="#rw-dark"/></svg>
    <div class="t"><b>riverbendwebcoleads</b><span>Riverbend Web Co. lead finder</span></div>
    <div class="sp"></div>
    <button type="button" id="savedBtn">Saved leads</button>
    <button type="button" id="logoutBtn">Log out</button>
  </header>
  <main class="feed" id="feed" aria-live="polite"><div class="wrap" id="thread"></div></main>
  <div class="composer">
    <form id="chatForm" autocomplete="off">
      <input id="q" type="text" placeholder="Try: bars with no website" aria-label="Message" enterkeyhint="send">
      <button type="submit">Send</button>
    </form>
  </div>
</section>

<script>
(function(){
'use strict';
const API='https://script.google.com/macros/s/AKfycbwkosfcFSHGXy8EUaAFZ7Q-SFDFllV_k4n8qBABRxoj2hv59RspTU9APLQabwP_ohaW/exec';
const $=s=>document.querySelector(s);
function el(tag,props,...kids){
  const n=document.createElement(tag);
  if(props) for(const k in props){ const v=props[k]; if(v==null||v===false) continue;
    if(k==='class') n.className=v; else if(k==='text') n.textContent=v; else if(k.slice(0,2)==='on') n.addEventListener(k.slice(2),v); else n.setAttribute(k,v); }
  kids.flat(Infinity).forEach(c=>{ if(c==null||c===false) return; n.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return n;
}
let token=''; try{ token=sessionStorage.getItem('rbStudio')||''; }catch(_){}
let status={hasKey:false,stages:['New','Contacted','Demo built','Pitched','Won','Lost']};
let busy=false;

async function api(body){
  let r;
  try{
    const res=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({token},body))});
    r=await res.json();
  }catch(_){ return {ok:false,error:'network'}; }
  if(r&&r.error==='auth') signOut(true);
  return r||{ok:false,error:'server'};
}

/* ---------- Login ---------- */
$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const pw=$('#pw').value; if(!pw) return;
  const b=$('#loginBtn'),m=$('#loginMsg'); b.disabled=true; b.textContent='Checking...'; m.textContent=''; m.className='msg';
  const r=await api({action:'login',password:pw});
  b.disabled=false; b.textContent='Log In';
  if(r.ok){ token=r.token; try{sessionStorage.setItem('rbStudio',token);}catch(_){} $('#pw').value=''; start(); return; }
  m.className='msg err';
  m.textContent={badpassword:'That password is not right.',locked:'Too many tries. Wait 15 minutes and try again.',network:'Cannot reach the server. Check your connection.'}[r.error]||'Something went wrong. Try again.';
});
function signOut(expired){
  if(!expired&&token) api({action:'logout'});
  token=''; try{sessionStorage.removeItem('rbStudio');}catch(_){}
  $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
  if(expired){ $('#loginMsg').className='msg err'; $('#loginMsg').textContent='Your session ended. Log in again.'; }
  $('#pw').focus();
}
$('#logoutBtn').addEventListener('click',()=>signOut(false));

/* ---------- Chat ---------- */
const thread=$('#thread'), feed=$('#feed');
function scroll(){ requestAnimationFrame(()=>{ feed.scrollTop=feed.scrollHeight; }); }
function me(text){ thread.appendChild(el('div',{class:'row me'},el('div',{class:'bubble',text}))); scroll(); }
function bot(kids,wide){ const b=el('div',{class:'bubble'},kids); const r=el('div',{class:'row bot'+(wide?' wide':'')},b); thread.appendChild(r); scroll(); return b; }
function typing(label){ const r=el('div',{class:'row bot'},el('div',{class:'bubble'},el('span',{class:'typing'},el('i',{class:'dot'}),el('i',{class:'dot'}),el('i',{class:'dot'}),' '+(label||'Working')))); thread.appendChild(r); scroll(); return r; }
function sugs(list){ return el('div',{class:'sugs'},list.map(t=>el('button',{type:'button',class:'sug',onclick:()=>send(t)},t))); }

const STARTERS=['Bars with no website','Restaurants with bad websites','Auto repair shops','Roofers and contractors','Hair salons and barbers','Show my saved leads'];

function hello(){
  bot([el('p',null,el('b',null,'Hey, I find local businesses that need you.')),
    el('p',null,'Tell me what kind of business to look for. I pull every one I can find around Dubuque, check whether each has a real website, then put the best leads first: no website, only a Facebook page, then weak or outdated sites. Free, no setup.'),
    sugs(STARTERS)]);
}

function keySetup(){
  const input=el('input',{type:'password',placeholder:'AIza...','aria-label':'Google API key',autocomplete:'off'});
  const msg=el('div',{class:'msg'});
  const btn=el('button',{type:'button',class:'btn primary',text:'Save key'});
  btn.addEventListener('click',async()=>{
    const k=input.value.trim(); if(!k) return;
    btn.disabled=true; btn.textContent='Checking with Google...'; msg.className='msg'; msg.textContent='';
    const r=await api({action:'leads_key',key:k});
    btn.disabled=false; btn.textContent='Save key';
    if(r.ok){ input.value=''; status.hasKey=true; msg.textContent='Connected. You are ready to go.'; hello(); }
    else { msg.className='msg err'; msg.textContent=r.message||'That key did not work.'; }
  });
  bot([el('p',null,el('b',null,'One-time setup: connect Google')),
    el('p',null,'I use Google business listings to find leads. You only do this once, about 5 minutes.'),
    el('ol',{class:'steps'},
      el('li',null,'Go to ',el('a',{href:'https://console.cloud.google.com/',target:'_blank',rel:'noopener'},'console.cloud.google.com'),' and sign in with riverbendwebco@gmail.com. Create a project named riverbendwebcoleads.'),
      el('li',null,'Open Billing and add a card. Normal use stays inside Google\'s free monthly allowance. Set a budget alert at $5 so you are told if it ever charges.'),
      el('li',null,'Open APIs and Services, then Library. Search "Places API (New)" and click Enable.'),
      el('li',null,'Open APIs and Services, then Credentials. Click Create credentials, then API key. Copy the key.'),
      el('li',null,'Paste it below. It is stored on the server and never shown again.')),
    el('div',{class:'keyrow'},input,btn),msg,
    el('p',{class:'note'},'Searches are capped at 300 Google calls a day so nothing runs away.')],true);
}

/* ---------- Understanding the message ---------- */
const CATS=[
  [/\b(bars?|pubs?|taverns?|taps?|saloons?|taprooms?|lounges?|dive)\b/,'bars'],
  [/\bbrewer(y|ies)|winer(y|ies)|distiller(y|ies)\b/,'breweries and wineries'],
  [/\bpizza/,'pizza'],[/\bmexican|tacos?\b/,'mexican restaurants'],[/\bchinese|asian|thai|sushi|japanese\b/,'asian restaurants'],
  [/\b(bbq|barbecue|smokehouse)\b/,'bbq restaurants'],[/\b(coffee|cafes?|espresso)\b/,'coffee shops'],[/\bbaker(y|ies)|donuts?\b/,'bakeries'],
  [/\bfood trucks?\b/,'food trucks'],[/\b(restaurants?|diners?|eater(y|ies)|grills?|food)\b/,'restaurants'],
  [/\bcar ?wash/,'car washes'],[/\b(auto|car|truck)\s*(repair|mechanics?|shops?|service|garage)|\bmechanics?\b|\btires?\b|\boil change/,'auto repair'],[/\bbody shops?|collision\b/,'auto body shops'],
  [/\bplumb/,'plumbers'],[/\belectric/,'electricians'],[/\broof/,'roofing contractors'],[/\bhvac|heating|furnace|air condition/,'hvac'],
  [/\b(contractors?|construction|remodel|builders?)\b/,'contractors'],[/\b(landscap|lawn|snow removal|tree service)/,'landscaping'],
  [/\bclean(ing|ers)?\b|\bjanitor|maid/,'cleaning services'],[/\bpaint(ers|ing)\b/,'painters'],[/\bconcrete|paving|asphalt\b/,'concrete contractors'],
  [/\bhandym[ae]n\b/,'handyman'],[/\bpest|exterminat/,'pest control'],[/\btow(ing)?\b/,'towing'],[/\bmov(ers|ing company)\b/,'movers'],
  [/\b(salons?|hair)\b/,'hair salons'],[/\bbarbers?\b/,'barber shops'],[/\bnails?\b/,'nail salons'],[/\btattoo/,'tattoo shops'],[/\bspas?\b|massage/,'spas and massage'],
  [/\bgyms?|fitness|crossfit|yoga\b/,'gyms'],[/\bdentist|dental\b/,'dentists'],[/\bchiropract/,'chiropractors'],[/\bvet(erinar(y|ians))?s?\b|animal hospital/,'veterinarians'],
  [/\bboutiques?|cloth/,'clothing boutiques'],[/\bflorists?|flowers?\b/,'florists'],[/\bgift shops?|antiques?\b/,'gift and antique shops'],
  [/\breal estate|realtors?\b/,'real estate agents'],[/\binsurance\b/,'insurance agents'],[/\blawyers?|attorneys?|law firms?\b/,'lawyers'],
  [/\bdaycares?|child ?care\b/,'daycares'],[/\bchurch(es)?\b/,'churches'],[/\bphotograph/,'photographers'],[/\bdog groom|pet groom/,'pet groomers']
];
const TOWNS={'east dubuque':'East Dubuque, IL','galena':'Galena, IL','asbury':'Asbury, IA','peosta':'Peosta, IA','dyersville':'Dyersville, IA','epworth':'Epworth, IA','cascade':'Cascade, IA','platteville':'Platteville, WI','bellevue':'Bellevue, IA','farley':'Farley, IA','maquoketa':'Maquoketa, IA','dubuque':'Dubuque, IA'};
function understand(raw){
  const t=raw.toLowerCase().replace(/[^\w\s',&-]/g,' ').replace(/\s+/g,' ').trim();
  if(/^(hi|hey|hello|yo|sup)\b/.test(t)&&t.split(' ').length<4) return {type:'hello'};
  if(/\b(help|what can you|how do)\b/.test(t)) return {type:'help'};
  if(/\b(saved|my leads|pipeline|my list|follow ?ups?)\b/.test(t)) { const st=status.stages.find(s=>t.includes(s.toLowerCase())); return {type:'saved',stage:st||''}; }
  let mode='best';
  if(/\b(no|without|don'?t have|doesn'?t have|missing|needs?)\b.*\b(web ?sites?|sites?)\b|\bno site\b/.test(t)) mode='none';
  else if(/\b(bad|old|outdated|weak|ugly|broken|crappy|terrible|dated)\b/.test(t)) mode='weak';
  else if(/\ball\b/.test(t)) mode='all';
  let city='';
  for(const k in TOWNS) if(new RegExp('\\b(in|near|around)\\s+'+k+'\\b').test(t)) { city=TOWNS[k]; break; }
  let q='';
  for(const [re,label] of CATS) if(re.test(t)) { q=label; break; }
  if(!q){
    q=t.replace(/\b(find|show|get|give|me|some|any|the|a|an|leads?|businesses|business|places?|in|near|around|dubuque|iowa|ia|that|who|which|with|without|no|have|has|need|needs|don'?t|doesn'?t|web ?sites?|sites?|bad|old|outdated|weak|all|please|for|of|look|looking|search)\b/g,' ').replace(/\s+/g,' ').trim();
    for(const k in TOWNS) q=q.replace(new RegExp('\\b'+k.replace(' ','\\s')+'\\b','g'),'').trim();
  }
  if(!q) return {type:'unclear'};
  return {type:'find',q,mode,city};
}

async function send(text){
  text=String(text||'').trim(); if(!text||busy) return;
  me(text); $('#q').value='';
  const it=understand(text);
  if(it.type==='hello') return hello();
  if(it.type==='help') return help();
  if(it.type==='unclear') return bot([el('p',null,'Tell me a kind of business, like bars, pizza, roofers or hair salons.'),sugs(STARTERS)]);
  if(it.type==='saved') return showSaved(it.stage);
  busy=true;
  const w=typing('Searching for '+it.q+(it.city&&!/^Dubuque/.test(it.city)?' in '+it.city:' in Dubuque')+' and checking their websites. A new search can take up to a minute');
  const r=await api({action:'leads_find',q:it.q,city:it.city||undefined});
  w.remove(); busy=false;
  if(!r.ok){
    if(r.error==='nokey'){ status.hasKey=false; return keySetup(); }
    return bot(el('p',null,r.message||'That search did not work. Try again in a minute.'));
  }
  showResults(r,it);
}

function help(){
  bot([el('p',null,el('b',null,'Here is what I can do')),
    el('ul',{class:'issues'},
      el('li',null,'Find businesses: "bars", "pizza places", "roofers in Asbury", "salons in Galena".'),
      el('li',null,'Filter: add "with no website" or "with bad websites".'),
      el('li',null,'Every lead has Call, Map, Save and Build demo. Build demo makes a Studio demo from their real info.'),
      el('li',null,'Say "saved leads" to see your list, set stages (Contacted, Pitched, Won) and add notes.')),
    sugs(STARTERS)]);
}

/* ---------- Results ---------- */
const TAGS={none:'No website',social:'Social page only',weak:'Weak website',site:'Has a website',chain:'Chain'};
function showResults(r,it){
  const c=r.counts;
  let shown=r.leads, rest=[];
  if(it.mode==='none') { shown=r.leads.filter(l=>l.kind==='none'||l.kind==='social'); }
  else if(it.mode==='weak') { shown=r.leads.filter(l=>l.kind==='weak'); }
  else if(it.mode==='best') { shown=r.leads.filter(l=>l.kind==='none'||l.kind==='social'||l.kind==='weak'); rest=r.leads.filter(l=>!shown.includes(l)); }
  const where=it.city&&!/^Dubuque/.test(it.city)?it.city.split(',')[0]:'Dubuque';
  const head=c.total
    ? 'Found '+c.total+' '+it.q+' around '+where+'. '+(c.none+c.social)+' have no real website and '+c.weak+' have a weak one.'
    : 'I could not find any '+it.q+' around '+where+'. Try a different word.';
  const kids=[el('p',null,el('b',null,head))];
  if(c.total) kids.push(el('div',{class:'stats'},
    el('div',{class:'stat hot'},el('b',null,String(c.none)),el('span',null,'No website')),
    el('div',{class:'stat hot'},el('b',null,String(c.social)),el('span',null,'Social page only')),
    el('div',{class:'stat warm'},el('b',null,String(c.weak)),el('span',null,'Weak website')),
    el('div',{class:'stat'},el('b',null,String(c.site+c.chain)),el('span',null,'Good site or chain'))));
  if(c.total&&!shown.length) kids.push(el('p',null,'None match that filter. Here is everything instead.'));
  const list=el('div',{class:'cards'},(shown.length?shown:r.leads).map(leadCard));
  kids.push(list);
  if(rest.length){
    const more=el('button',{type:'button',class:'btn sm more',text:'Show '+rest.length+' with good sites or chains'});
    more.addEventListener('click',()=>{ rest.forEach(l=>list.appendChild(leadCard(l))); more.remove(); });
    kids.push(more);
  }
  kids.push(el('p',{class:'note',style:'margin-top:10px'},r.free?'Businesses come from free public map data, so a few may be missing. Website checks come from the map, a web search and a quick look at each site. Open it yourself before you pitch.':'Website checks come from Google and a quick look at each site. Open it yourself before you pitch.'));
  bot(kids,true);
}

function tel(p){ const d=String(p||'').replace(/\D/g,''); return d.length>=10?'tel:+1'+d.slice(-10):''; }
function leadCard(l){
  const where=[l.address,l.city].filter(Boolean).join(', ');
  const saveBtn=el('button',{type:'button',class:'btn sm'+(l.saved?' saved-on':''),text:l.saved?'Saved':'Save'});
  saveBtn.addEventListener('click',async()=>{
    if(l.saved) return;
    saveBtn.disabled=true; saveBtn.textContent='Saving...';
    const r=await api({action:'leads_save',lead:l});
    saveBtn.disabled=false;
    if(r.ok){ l.saved='New'; saveBtn.textContent='Saved'; saveBtn.classList.add('saved-on'); } else saveBtn.textContent='Save';
  });
  const demoBtn=el('button',{type:'button',class:'btn sm dark',text:'Build demo'});
  const out=el('div');
  demoBtn.addEventListener('click',()=>buildDemo(l,demoBtn,out));
  return el('div',{class:'card'},
    el('div',{class:'card-h'},
      el('div',null,el('h3',null,l.name),el('div',{class:'sub'},[l.type,where].filter(Boolean).join(' · '))),
      el('span',{class:'tag '+l.kind},TAGS[l.kind]||'')),
    el('div',{class:'meta'},
      l.rating?el('span',null,l.rating.toFixed(1)+' stars, '+l.reviews+' Google reviews'):null,
      l.phone?el('span',null,l.phone):null),
    l.issues&&l.issues.length&&l.kind!=='site'?el('ul',{class:'issues'},l.issues.map(i=>el('li',null,i))):null,
    el('div',{class:'acts'},
      tel(l.phone)?el('a',{class:'btn sm',href:tel(l.phone)},'Call'):null,
      l.maps?el('a',{class:'btn sm',href:l.maps,target:'_blank',rel:'noopener'},'Map'):null,
      l.website?el('a',{class:'btn sm',href:l.website,target:'_blank',rel:'noopener'},'Their site'):null,
      saveBtn,demoBtn),
    out);
}

async function buildDemo(l,btn,out){
  btn.disabled=true; btn.textContent='Building...';
  out.replaceChildren(el('p',{class:'note',style:'margin:10px 0 0'},l.website&&l.kind!=='social'?'Reading their website. About 20 seconds.':'Using their Google info. A few seconds.'));
  const r=await api({action:'leads_demo',lead:l});
  btn.disabled=false; btn.textContent='Build demo';
  if(!r.ok){ out.replaceChildren(el('p',{class:'msg err'},'Could not build the demo. Try again.')); return; }
  l.saved=l.saved||'Demo built';
  const got=[r.items?r.items+' menu items':'',r.photos?r.photos+' photos':''].filter(Boolean).join(' and ');
  out.replaceChildren(el('div',{style:'margin-top:10px;padding:10px 12px;border:1px solid #BBF7D0;background:#F0FDF4;border-radius:8px;font-size:.88rem'},
    el('b',null,'Demo ready. '),got?'Pulled '+got+' from their site. ':'Built from their listing. ',
    'Add photos and a menu in the Studio before you pitch.',
    el('div',{class:'acts'},
      el('a',{class:'btn sm primary',href:'/demo/?d='+encodeURIComponent(r.slug),target:'_blank',rel:'noopener'},'Open demo'),
      el('a',{class:'btn sm',href:'/studio/#'+encodeURIComponent(r.slug),target:'_blank',rel:'noopener'},'Edit in Studio'))));
}

/* ---------- Saved pipeline ---------- */
async function showSaved(stage){
  busy=true; const w=typing('Loading your saved leads'); const r=await api({action:'leads_saved'}); w.remove(); busy=false;
  if(!r.ok) return bot(el('p',null,'Could not load your saved leads. Try again.'));
  let leads=r.leads||[];
  if(stage) leads=leads.filter(l=>l.stage===stage);
  if(!leads.length) return bot([el('p',null,stage?'No saved leads are marked '+stage+'.':'You have not saved any leads yet. Search for some and tap Save.'),sugs(STARTERS.slice(0,4))]);
  const by={}; (r.leads||[]).forEach(l=>{ by[l.stage]=(by[l.stage]||0)+1; });
  const summary=status.stages.filter(s=>by[s]).map(s=>by[s]+' '+s).join(', ');
  const n=x=>x+' saved lead'+(x===1?'':'s');
  const chips=el('div',{class:'sugs'},stage?el('button',{type:'button',class:'sug',onclick:()=>send('Show my saved leads')},'All saved'):null,
    status.stages.filter(s=>by[s]&&s!==stage).map(s=>el('button',{type:'button',class:'sug',onclick:()=>send('Saved leads '+s)},s+' ('+by[s]+')')));
  bot([el('p',null,el('b',null,(stage?n(leads.length)+' marked '+stage:'You have '+n(leads.length))+'.'),stage?'':' '+summary+'.'),
    el('div',{class:'cards'},leads.map(savedCard)),chips],true);
}
function savedCard(l){
  const sel=el('select',{'aria-label':'Stage'},status.stages.map(s=>{ const o=el('option',{value:s},s); if(s===l.stage) o.selected=true; return o; }));
  const tagEl=el('span',{class:'tag '+(/no website/i.test(l.lead)?'none':/page, no real/i.test(l.lead)?'social':l.lead?'weak':'site')},l.stage);
  sel.addEventListener('change',async()=>{ const r=await api({action:'leads_update',id:l.id,stage:sel.value}); if(r.ok){ l.stage=sel.value; tagEl.textContent=sel.value; } });
  const notes=el('textarea',{rows:'1',placeholder:'Notes: who you talked to, when to follow up','aria-label':'Notes'});
  notes.value=l.notes||'';
  notes.addEventListener('blur',async()=>{ if(notes.value!==l.notes){ const r=await api({action:'leads_update',id:l.id,notes:notes.value}); if(r.ok) l.notes=notes.value; } });
  const rm=el('button',{type:'button',class:'btn sm',text:'Remove'});
  const card=el('div',{class:'card'},
    el('div',{class:'card-h'},el('div',null,el('h3',null,l.name),el('div',{class:'sub'},[l.type,l.address].filter(Boolean).join(' · ')+(l.saved?' · saved '+l.saved:''))),
      tagEl),
    l.lead?el('ul',{class:'issues'},l.lead.split('; ').map(i=>el('li',null,i))):null,
    el('div',{class:'pipe'},sel,notes),
    el('div',{class:'acts'},
      tel(l.phone)?el('a',{class:'btn sm',href:tel(l.phone)},'Call '+l.phone):null,
      l.maps?el('a',{class:'btn sm',href:l.maps,target:'_blank',rel:'noopener'},'Map'):null,
      l.demo?el('a',{class:'btn sm primary',href:'/demo/?d='+encodeURIComponent(l.demo),target:'_blank',rel:'noopener'},'Open demo'):null,
      rm));
  rm.addEventListener('click',async()=>{ if(!confirm('Remove '+l.name+' from saved leads?')) return; const r=await api({action:'leads_update',id:l.id,remove:true}); if(r.ok) card.remove(); });
  return card;
}

$('#chatForm').addEventListener('submit',e=>{ e.preventDefault(); send($('#q').value); });
$('#savedBtn').addEventListener('click',()=>send('Show my saved leads'));

async function start(){
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  thread.replaceChildren();
  const w=typing('Starting up');
  const s=await api({action:'leads_status'});
  w.remove();
  if(!s.ok){ if(!token) return; bot(el('p',null,'Could not reach the server. Refresh to try again.')); return; }
  status=Object.assign(status,s);
  hello();
  $('#q').focus();
}
if(token) start(); else $('#pw').focus();
})();
