name: Daily leads

# Every morning before 7 AM Central: find up to 50 new local leads around Dubuque
# (about 30 miles) and save them into the riverbendwebco.com/leads portal.
on:
  schedule:
    - cron: '10 11 * * *'   # 5:10 AM CST / 6:10 AM CDT
  push:
    branches: [main]
    paths: ['tools/daily_leads.py', '.github/workflows/daily-leads.yml']
  workflow_dispatch:
    inputs:
      target:
        description: 'How many leads to add'
        default: '50'

permissions:
  contents: write
  id-token: write

concurrency:
  group: daily-leads
  cancel-in-progress: true

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Find and save leads
        env:
          TARGET: ${{ github.event.inputs.target || '50' }}
        run: python3 tools/daily_leads.py
      - name: Save the summary for the phone report
        if: always()
        run: |
          [ -f daily-leads-summary.txt ] || echo "The daily lead finder did not finish today. Check GitHub > Actions > Daily leads." > daily-leads-summary.txt
          cp daily-leads-summary.txt /tmp/summary.txt
          git config user.name "riverbend-leads-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q origin daily-leads-log 2>/dev/null; then git checkout -q -B daily-leads-log FETCH_HEAD; else git checkout -q --orphan daily-leads-log; git rm -rq --cached . ; fi
          { date -u +%Y-%m-%dT%H:%M:%SZ; cat /tmp/summary.txt; } > summary.txt
          git add summary.txt
          git commit -qm "Daily leads summary $(date -u +%F)"
          git push -q origin daily-leads-log
