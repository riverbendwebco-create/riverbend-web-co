<html lang="en">
<head>
<meta charset="utf-8">

<meta name="referrer" content="no-referrer">

<title>Billing | Riverbend Web Co.</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#04070D;--card:#0A101B;--card2:#0F1726;--line:#161F2E;--line2:#232E42;--ink:#E8EEF8;--txt:#CFD8E6;--mut:#8592A6;--dim:#5B6779;--blue:#2F7BFF;--blue2:#5B9BFF;--red:#FF5A63;--amber:#F2B23B;--green:#2BC48A;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;--disp:'Barlow Condensed','Arial Narrow',Inter,sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}a{color:var(--blue2)}.hidden{display:none!important}
svg.rw{width:40px;height:auto;aspect-ratio:1115/562;display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 13px;border-radius:7px;border:1px solid var(--line2);background:var(--card2);font-weight:600;font-size:.82rem;cursor:pointer;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:#3A4864}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.go{background:var(--green);border-color:var(--green);color:#04120B;font-weight:700}
.btn.danger{color:var(--red);border-color:rgba(255,90,99,.45)}.btn[disabled]{opacity:.5;cursor:default}
.field{display:block;width:100%;height:42px;border:1px solid var(--line2);border-radius:8px;padding:0 12px;outline:none;background:var(--bg);color:var(--ink)}
.field:focus{border-color:var(--blue)}
.msg{min-height:20px;margin-top:10px;font-size:.88rem;color:var(--mut)}.msg.err{color:var(--red)}.msg.ok{color:var(--green)}
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:30px 26px}
.login-card small,.hd small,.k{display:block;font-family:var(--mono);font-size:.66rem;letter-spacing:.22em;color:var(--mut);text-transform:uppercase}
.login-card h1,.hd h1{font-family:var(--disp);font-style:italic;font-weight:700;font-size:2.4rem;line-height:1;margin:4px 0 8px;text-transform:uppercase;color:#fff}
.login-card p{margin:0 0 16px;color:var(--mut);font-size:.9rem}
.wrap{max-width:1080px;margin:0 auto;padding:18px 20px 60px}
.brandbar{display:flex;align-items:center;gap:10px;padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.brandbar b{font-size:.9rem;color:#fff}.brandbar nav{margin-left:auto;display:flex;gap:8px}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.mode{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;padding:6px 10px;border-radius:6px;border:1px solid}
.mode.test{color:var(--amber);border-color:rgba(242,178,59,.5);background:rgba(242,178,59,.08)}.mode.live{color:var(--green);border-color:rgba(43,196,138,.5);background:rgba(43,196,138,.08)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:12px 14px}.stat b{display:block;font-size:1.35rem;margin-top:4px}
.panel{background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:16px;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th{text-align:left;font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600;padding:8px 8px;border-bottom:1px solid var(--line2)}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--txt)}
tr.row{cursor:pointer}tr.row:hover td{background:var(--card2)}
td b{color:#fff;font-weight:600}
.tag{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 7px;border-radius:5px;border:1px solid var(--line2);color:var(--txt);white-space:nowrap}
.tag.ok{color:var(--green);border-color:rgba(43,196,138,.4)}.tag.warn{color:var(--amber);border-color:rgba(242,178,59,.4)}.tag.bad{color:var(--red);border-color:rgba(255,90,99,.4)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 16px}
.grid div small{display:block;font-size:.68rem;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
.grid div span{color:#fff;font-weight:600;font-size:.9rem}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.log{max-height:260px;overflow:auto;font-size:.8rem;color:var(--mut);font-family:var(--mono)}.log div{padding:4px 0;border-bottom:1px solid var(--line)}
.modal{position:fixed;inset:0;background:rgba(2,4,8,.72);display:grid;place-items:center;padding:16px;z-index:20}
.modal .box{width:100%;max-width:480px;background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:22px}
.modal h2{margin:0 0 12px;font-size:1.2rem}.modal dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0 0 16px;font-size:.92rem}
.modal dt{color:var(--mut)}.modal dd{margin:0;color:#fff;font-weight:600}
.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.set{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.set h3{margin:0 0 8px;font-size:.95rem}.set label{display:block;font-size:.78rem;color:var(--mut);margin:8px 0 4px}
.res div{padding:5px 0;font-size:.85rem;border-bottom:1px solid var(--line)}
@media(max-width:760px){.stats,.grid{grid-template-columns:1fr 1fr}.set{grid-template-columns:1fr}.hide-m{display:none}}
</style>

<section class="login" id="login">
  <form class="login-card" id="loginForm">
    <svg class="rw" style="width:54px" aria-label="Riverbend Web Co."><use href="#rw-dark"/></svg>
    <small style="margin-top:18px">RIVERBEND WEB CO.</small>
    <h1>Billing</h1>
    <p>Client payments, launches and past-due accounts. Same password as the Demo Studio.</p>
    <input class="field" id="pw" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password">
    <button class="btn primary" type="submit" id="loginBtn" style="width:100%;height:44px;margin-top:12px">Log In</button>
    <div class="msg" id="loginMsg" role="alert"></div>
  </form>
</section>
<section class="hidden" id="app"><div class="wrap">
  <div class="brandbar"><svg class="rw" aria-hidden="true"><use href="#rw-dark"/></svg><b>Riverbend Billing</b>
    <nav><a class="btn" href="/studio/">Studio</a><a class="btn" href="/leads/">Leads</a><button class="btn" id="out" type="button">Log out</button></nav></div>
  <div class="hd"><div><small>Square payments</small><h1>Billing</h1></div><div class="row2"><span class="mode test" id="mode">TEST MODE</span><button class="btn" id="refresh" type="button">Refresh</button><button class="btn" id="setBtn" type="button">Square settings</button></div></div>
  <div class="stats" id="stats"></div>
  <div class="panel hidden" id="settings"></div>
  <div class="panel hidden" id="detail"></div>
  <div class="panel" style="padding:6px 10px"><table><thead><tr><th>Business</th><th>Package</th><th class="hide-m">Monthly</th><th>Status</th><th class="hide-m">Payments</th><th>Next bill</th></tr></thead><tbody id="rows"></tbody></table><div class="msg" id="listMsg"></div></div>
</div></section>
<div class="modal hidden" id="modal"><div class="box" id="mbox"></div></div>
<script>
(function(){
'use strict';
const API='https://script.google.com/macros/s/AKfycbwkosfcFSHGXy8EUaAFZ7Q-SFDFllV_k4n8qBABRxoj2hv59RspTU9APLQabwP_ohaW/exec';
const $=s=>document.querySelector(s);
function el(tag,props,...kids){ const n=document.createElement(tag); if(props) for(const k in props){ const v=props[k]; if(v==null||v===false) continue; if(k==='class') n.className=v; else if(k==='text') n.textContent=v; else if(k.slice(0,2)==='on') n.addEventListener(k.slice(2),v); else n.setAttribute(k,v);} kids.flat(Infinity).forEach(c=>{ if(c==null||c===false) return; n.appendChild(typeof c==='string'?document.createTextNode(c):c); }); return n; }
const usd=c=>'$'+((c||0)/100).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const ld=s=>{ if(!s) return ''; const d=new Date(s+'T12:00:00'); return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); };
let token=''; try{ token=sessionStorage.getItem('rbStudio')||''; }catch(_){}
let data={accounts:[],settings:{}}, openId='';
async function api(body){ let r; try{ const res=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({token},body))}); r=await res.json(); }catch(_){ return {ok:false,error:'network'}; } if(r&&r.error==='auth') signOut(true); return r||{ok:false,error:'server'}; }
$('#loginForm').addEventListener('submit',async e=>{ e.preventDefault(); const pw=$('#pw').value; if(!pw) return; const b=$('#loginBtn'); b.disabled=true; b.textContent='Checking...';
  const r=await api({action:'login',password:pw}); b.disabled=false; b.textContent='Log In';
  if(r.ok){ token=r.token; try{sessionStorage.setItem('rbStudio',token);}catch(_){} $('#pw').value=''; start(); return; }
  $('#loginMsg').className='msg err'; $('#loginMsg').textContent={badpassword:'That password is not right.',locked:'Too many tries. Wait 15 minutes.',network:'Cannot reach the server.'}[r.error]||'Something went wrong.'; });
function signOut(expired){ if(!expired&&token) api({action:'logout'}); token=''; try{sessionStorage.removeItem('rbStudio');}catch(_){} $('#app').classList.add('hidden'); $('#login').classList.remove('hidden'); if(expired){ $('#loginMsg').className='msg err'; $('#loginMsg').textContent='Your session ended. Log in again.'; } }
$('#out').addEventListener('click',()=>signOut(false));
$('#refresh').addEventListener('click',()=>load());
$('#setBtn').addEventListener('click',()=>{ $('#settings').classList.toggle('hidden'); drawSettings(); });

function tagFor(a){ const p=a.payStatus; const cls=p==='Current'?'ok':/grace|Waiting/.test(p)?'warn':'bad'; return el('span',{class:'tag '+cls,text:p}); }
async function load(){
  $('#listMsg').textContent='Loading...';
  const r=await api({action:'billing_list'});
  if(!r.ok){ $('#listMsg').textContent='Could not load billing ('+(r.detail||r.error)+').'; return; }
  data=r; $('#listMsg').textContent=r.accounts.length?'':'No billing accounts yet. One is created each time a client signs the agreement.';
  const live=r.settings.env==='production'; $('#mode').textContent=live?'LIVE: REAL CARDS':'TEST MODE (SANDBOX)'; $('#mode').className='mode '+(live?'live':'test');
  const A=r.accounts.filter(a=>a.env===r.settings.env);
  const mrr=A.filter(a=>a.status==='active'||a.status==='canceling').reduce((s,a)=>s+a.monthly,0);
  const due=A.reduce((s,a)=>s+a.pastDue,0);
  $('#stats').replaceChildren(
    el('div',{class:'stat'},el('small',{class:'k',text:'Monthly billing'}),el('b',{text:usd(mrr)})),
    el('div',{class:'stat'},el('small',{class:'k',text:'Active clients'}),el('b',{text:String(A.filter(a=>a.status==='active'||a.status==='canceling').length)})),
    el('div',{class:'stat'},el('small',{class:'k',text:'Waiting to launch'}),el('b',{text:String(A.filter(a=>a.status==='building'||a.status==='awaiting_card').length)})),
    el('div',{class:'stat'},el('small',{class:'k',text:'Past due'}),el('b',{text:usd(due),style:due?'color:var(--red)':''})));
  $('#rows').replaceChildren(...r.accounts.map(a=>el('tr',{class:'row',onclick:()=>openAcct(a.id)},
    el('td',null,el('b',{text:a.business}),el('div',{style:'font-size:.78rem;color:var(--mut)',text:a.owner+(a.env!==r.settings.env?' (test account)':'')})),
    el('td',{text:a.packageName+', '+a.optionName}),el('td',{class:'hide-m',text:usd(a.monthly)}),
